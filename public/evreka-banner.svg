<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#64748b;#ffffff;#0f172a" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#64748b">
        <animate attributeName="stop-color" values="#64748b;#ffffff;#0f172a;#64748b" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#0f172a;#64748b;#ffffff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#334155">
        <animate attributeName="stop-color" values="#334155;#ffffff;#0f172a;#334155" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#64748b;#ffffff;#0f172a" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#cbd5e1">
        <animate attributeName="stop-color" values="#cbd5e1;#ffffff;#475569;#cbd5e1" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Monochromatic Bold Typography -->
  <text 
    x="50%" 
    y="85" 
    text-anchor="middle" 
    dominant-baseline="central"
    fill="url(#monoGrad)"
    stroke="#64748b"
    stroke-width="1.5"
    paint-order="stroke fill"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="98" 
    font-weight="900" 
    letter-spacing="18"
  >
    EVREKA
  </text>

  <!-- Accent Shimmer Bar -->
  <rect 
    y="138" 
    height="4" 
    rx="2" 
    fill="url(#accentLine)"
  >
    <animate attributeName="x" values="360;280;360" dur="4s" repeatCount="indefinite" />
    <animate attributeName="width" values="180;340;180" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
