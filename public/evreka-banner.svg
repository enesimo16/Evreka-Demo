<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5">
        <animate attributeName="stop-color" values="#4f46e5; #7c3aed; #2563eb; #4f46e5" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#9333ea">
        <animate attributeName="stop-color" values="#9333ea; #4f46e5; #7c3aed; #9333ea" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb; #9333ea; #4f46e5; #2563eb" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>

    <style>
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 82px;
        letter-spacing: 16px;
        fill: url(#glowGrad);
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 8px;
        fill: #94a3b8;
        text-transform: uppercase;
      }
      .dash-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { opacity: 0.6; transform: scale(0.99); }
        100% { opacity: 1; transform: scale(1.01); }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <g transform="translate(400, 105)" text-anchor="middle" class="dash-pulse" filter="url(#shadow)">
    <text class="text-title" y="0">EVREKA</text>
    <text class="text-subtitle" y="42">E-COMMERCE INTELLIGENCE &amp; OPERATIONS PLATFORM</text>
  </g>
</svg>
