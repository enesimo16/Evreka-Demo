<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <linearGradient id="evrekaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5">
        <animate attributeName="stop-color" values="#4f46e5;#7c3aed;#2563eb;#06b6d4;#4f46e5" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#ec4899;#4f46e5;#7c3aed" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#06b6d4;#7c3aed;#2563eb" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#4f46e5;#ec4899;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Animated Center Text -->
  <text 
    x="50%" 
    y="85" 
    text-anchor="middle" 
    dominant-baseline="central"
    fill="url(#evrekaGrad)"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="96" 
    font-weight="900" 
    letter-spacing="16"
  >
    EVREKA
  </text>

  <!-- Animated Bottom Accent Bar -->
  <rect 
    y="138" 
    height="4" 
    rx="2" 
    fill="url(#evrekaGrad)"
  >
    <animate attributeName="x" values="375;290;375" dur="4s" repeatCount="indefinite" />
    <animate attributeName="width" values="150;320;150" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
